name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must match internal/utils/version.go)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Tag and create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver version '$version'; expected something like v1.2.3"
            exit 1
          fi
          base_version="$(grep -oE 'baseVersion = "[^"]+"' internal/utils/version.go | cut -d'"' -f2)"
          if [ "$version" != "v${base_version}" ]; then
            echo "::error::internal/utils/version.go declares v${base_version}, which does not match '$version'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::Tag ${version} already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            --generate-notes
